name: portfolio-web-ci

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: portfolio-web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm build
      - name: External link smoke (PR)
        run: node scripts/check-external-links.mjs --mode=smoke --report artifacts/external-links-smoke.json
        # Permanent broken (401/404/…) fails the job; 403/429/transient soft warnings only.
      - name: Select browser checks
        id: browser-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "scope=$(node scripts/ci-test-scope.mjs "$BASE_SHA")" >> "$GITHUB_OUTPUT"
      - name: Content browser checks
        if: steps.browser-scope.outputs.scope == 'content'
        run: pnpm test:e2e:content
        env:
          CI: true
      - name: Full browser regression
        if: steps.browser-scope.outputs.scope == 'full'
        run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-quality-artifacts
          path: |
            artifacts/external-links-smoke.json
            artifacts/playwright/axe-best-practice-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-playwright-artifacts
          path: |
            artifacts/playwright
            playwright-report
            !artifacts/playwright/**/*.zip

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_RELEASE: 'true'
      PUBLIC_SITE_URL: https://cyson21.github.io
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm build
      - run: pnpm test:e2e:release
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-playwright-artifacts
          path: |
            artifacts/playwright
            playwright-report
